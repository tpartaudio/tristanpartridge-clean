<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dorian's Spleen - L'Entropiste - Tristan Partridge</title>

  <style>
    :root {
      --title: "Dorian's Spleen";
      --credit-by: by;
      --credit-name: L’Entropiste;
      --sound-role: Music + Sound Design + Mix;
      --sound-role-size: 0.65rem;
      --sound-role-opacity: 0.75;
      --sound-role-color: #000;

      --video-width: 380px;
      --video-height: 677px;
      --mobile-video-max-width: 340px;

      --title-font-size: 2.6rem;
      --dash-font-size: 1.4rem;
      --credit-font-size: 1.3rem;

      --mobile-title-font-size: 2rem;
      --mobile-dash-font-size: 1.2rem;
      --mobile-credit-font-size: 1.1rem;

      --close-top: 1.5rem;
      --close-right: 1.5rem;
      --close-font-size: 2.8rem;

      --index-page-url: index.html;
    }

    .sound-role {
      display: block;
      margin-bottom: 1.2rem;
      font-size: var(--sound-role-size);
      font-weight: 500;
      color: var(--sound-role-color);
      opacity: var(--sound-role-opacity);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
    }
    .dark .sound-role { color: #fff; }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: rgba(255,255,255,0.96);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .dark { background: rgba(0,0,0,0.96); }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10vh 5vw 15vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8rem;
      max-width: 1600px;
      width: 100%;
      flex-wrap: wrap;
    }

    .video-title {
      color: #000;
      line-height: 1.2;
      opacity: 0.95;
      margin: 0;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      flex: 1;
      min-width: 300px;
    }

    .video-title .title {
      font-weight: 700;
      font-size: var(--title-font-size);
      letter-spacing: -0.04em;
      margin: 0 0 0.5rem 0;
    }

    .video-title .dash {
      display: block;
      margin: 1rem 0;
      font-size: var(--dash-font-size);
      opacity: 0.5;
      font-weight: 300;
    }

    .video-title .credit {
      font-size: var(--credit-font-size);
      font-weight: 400;
      opacity: 0.9;
    }

    .video-title .credit strong {
      font-weight: 700;
    }

    .dark .video-title { color: #fff; }

    .videos-container {
      display: flex;
      gap: 5rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .video-container {
      position: relative;
      width: var(--video-width);
      height: var(--video-height);
      max-width: 90vw;
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 50px 120px rgba(0,0,0,0.38);
      cursor: pointer;
      flex-shrink: 0;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .close-btn {
      position: fixed;
      top: var(--close-top);
      right: var(--close-right);
      background: none;
      border: none;
      font-size: var(--close-font-size);
      cursor: pointer;
      color: #000;
      z-index: 1000;
      transition: transform 0.2s ease;
      font-weight: 300;
    }

    .dark .close-btn { color: #fff; }
    .close-btn:hover, .close-btn:active { transform: scale(1.25); }

    /* TABLET & MOBILE - STACKED LAYOUT */
    @media (max-width: 1024px) {
      .content {
        flex-direction: column;
        gap: 4rem;
        padding: 4vh 4vw;
      }

      .video-title {
        order: -1;
        max-width: 90vw;
      }

      .video-title .title   { font-size: var(--mobile-title-font-size); }
      .video-title .dash    { font-size: var(--mobile-dash-font-size); }
      .video-title .credit  { font-size: var(--mobile-credit-font-size); }

      .videos-container {
        flex-direction: column;
        gap: 4rem;
      }

      .video-container {
        width: 100%;
        max-width: var(--mobile-video-max-width);
        height: auto;
        border-radius: 20px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      }
    }

    @media (max-width: 480px) {
      .page-wrapper { padding: 8vh 4vw 12vh; }
      .video-title .title { font-size: 1.8rem; }
      .video-container { max-width: 300px; }
      .close-btn { top: 1rem; right: 1rem; font-size: 2.4rem; }
    }
  </style>
</head>

<body class="light">

  <div class="page-wrapper">
    <div class="content">

      <!-- Title -->
      <div class="video-title">
        <span class="sound-role" id="sound-role-el"></span>
        <div class="title" id="title-el"></div>
        <div class="dash">-</div>
        <div class="credit" id="credit-el"></div>
      </div>

      <!-- Videos -->
      <div class="videos-container">
        <div class="video-container" id="video-container-1">
          <iframe id="video-el-1" src="https://www.youtube.com/embed/1Kgrm146N-A?enablejsapi=1" 
                  title="YouTube video 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                  allowfullscreen></iframe>
        </div>

        <div class="video-container" id="video-container-2">
          <iframe id="video-el-2" src="https://www.youtube.com/embed/Uc-KAnqY6R4?enablejsapi=1" 
                  title="YouTube video 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                  allowfullscreen></iframe>
        </div>
      </div>

    </div>
  </div>

  <button class="close-btn" id="close-btn">×</button>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const titleEl = document.getElementById('title-el');
    const creditEl = document.getElementById('credit-el');
    const soundRoleEl = document.getElementById('sound-role-el');

    titleEl.textContent = getComputedStyle(document.documentElement).getPropertyValue('--title').trim();
    const byText = getComputedStyle(document.documentElement).getPropertyValue('--credit-by').trim();
    const nameText = getComputedStyle(document.documentElement).getPropertyValue('--credit-name').trim();
    creditEl.innerHTML = `${byText} <strong>${nameText}</strong>`;

    const soundRoleText = getComputedStyle(document.documentElement).getPropertyValue('--sound-role').trim();
    if (soundRoleText) soundRoleEl.textContent = soundRoleText;

    document.title = "Dorian's Spleen - L'Entropiste - Tristan Partridge";

    document.getElementById('close-btn').addEventListener('click', () => {
      window.location.href = getComputedStyle(document.documentElement).getPropertyValue('--index-page-url').trim();
    });

    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    let player1, player2;
    function onPlayerStateChange1(e) { if (e.data === 1) player2?.pauseVideo(); }
    function onPlayerStateChange2(e) { if (e.data === 1) player1?.pauseVideo(); }

    window.onYouTubeIframeAPIReady = function() {
      player1 = new YT.Player('video-el-1', { events: { 'onStateChange': onPlayerStateChange1 } });
      player2 = new YT.Player('video-el-2', { events: { 'onStateChange': onPlayerStateChange2 } });
    };
  </script>
</body>
</html>
