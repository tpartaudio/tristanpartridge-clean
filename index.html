  <!-- Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    :root {
      --logo-height: 85px;
      --cursor-title-size: 0.88rem;
      --cursor-title-padding: 8px 14px;
    }

    html { scroll-behavior: smooth; scroll-restoration: manual; }

    /* NAVBAR */
    .nav-container {
      backdrop-filter: blur(60px) saturate(180%);
      background: rgba(255,255,255,0.85);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      will-change: transform;
    }
    .dark .nav-container { background: rgba(0,0,0,0.85); }

    .logo-container { position: absolute; left: 2rem; top: 1.5rem; z-index: 55; }
    #logo { height: var(--logo-height); cursor: pointer; transition: transform 0.2s ease-out; transform: translateY(-18px); }
    #logo:hover { transform: scale(1.08) translateY(-18px); }

    .nav-links { position: relative; display: flex; gap: 40px; margin-left: auto; }
    .nav-link { font-weight: 600; padding: 8px 0; position: relative; z-index: 2; }
    .underline { position: absolute; bottom: 4px; left: 0; height: 2px; background: #000; transition: all .22s cubic-bezier(.4,0,.2,1); }
    .dark .underline { background: #fff; }

    #hamburger { position: absolute; right: 2rem; top: 1.8rem; z-index: 60; background: transparent; border: none; display: none; align-items: center; justify-content: center; }
    #hamburger span { height: 4px; width: 32px; background-color: #000; transition: all 0.3s ease; display: block; border-radius: 2px; }
    .dark #hamburger span { background-color: #fff; }

    #mobile-menu { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      background: rgba(255,255,255,0.98); gap: 2.5rem; font-size: 1.9rem; font-weight: 600; 
      position: fixed; inset: 0; z-index: 55; opacity: 0; visibility: hidden; transition: opacity 0.4s, visibility 0.4s; 
    }
    #mobile-menu:not(.hidden) { opacity: 1; visibility: visible; pointer-events: auto; }
    #mobile-menu a { opacity: 0; transform: translateY(20px); transition: opacity 0.28s ease, transform 0.28s ease; }
    #mobile-menu:not(.hidden) a { opacity: 1; transform: translateY(0); }
    #mobile-menu a:nth-child(1) { transition-delay: 0.06s; }
    #mobile-menu a:nth-child(2) { transition-delay: 0.12s; }
    #mobile-menu a:nth-child(3) { transition-delay: 0.18s; }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      transition: all 0.6s;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: contain;
      cursor: default;
    }

    .works-container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
    .works-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem; }

    .project-card { 
      position: relative; 
      opacity: 0; 
      transform: translateY(70px);
    }
    .project-thumb {
      width: 100%; max-width: 320px; margin: 0 auto; aspect-ratio: 4/5; overflow: hidden; border-radius: 28px;
      cursor: none;
      box-shadow: 0 20px 50px rgba(0,0,0,0.18); background: #000;
      transition: transform .7s cubic-bezier(.22,1,.36,1), box-shadow .7s cubic-bezier(.22,1,.36,1);
    }
    .project-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.22,1,.36,1); }
    .project-thumb:hover { transform: translateY(-12px) scale(1.03); box-shadow: 0 60px 120px rgba(0,0,0,0.38); }
    .project-thumb:hover img { transform: scale(1.10); }

    /* TITLE CURSOR - ONLY ON DESKTOP */
    #title-cursor {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      padding: var(--cursor-title-padding);
      background: rgba(0,0,0,0.88);
      color: white;
      font-size: var(--cursor-title-size);
      font-weight: 600;
      letter-spacing: 0.6px;
      border-radius: 10px;
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.18s ease;
      white-space: nowrap;
      mix-blend-mode: difference;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      user-select: none;
    }
    .dark #title-cursor { background: rgba(255,255,255,0.92); color: #000; }

    @media (hover: none), (pointer: coarse) {
      #title-cursor { display: none !important; }
      .project-thumb { cursor: default !important; }
    }

    @media (max-width: 767px) {
      .nav-container {
        padding: 1.2rem 1rem;
        backdrop-filter: blur(20px) saturate(150%);
        height: 64px;
        align-items: center;
      }
      .logo-container { left: 1.25rem; top: 0.8rem; position: absolute; }
      #logo { height: 50px; transform: translateY(0); }
      #hamburger { display: flex; right: 1rem; top: 0.9rem; padding: 0.35rem; width: 44px; height: 44px; gap: 6px; opacity: 1; visibility: visible; }
      #hamburger span { height: 3px; width: 28px; }
      main { padding-top: 5.25rem; }
      .works-grid { grid-template-columns: 1fr; gap: 2.1rem; }
      .project-thumb { border-radius: 20px; max-width: 520px; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">

  <nav class="nav-container">
    <div class="logo-container">
      <img id="logo" src="4.png" alt="logo">
    </div>
    <div class="hidden md:flex nav-links text-lg font-medium">
      <a href="index.html" class="nav-link active" data-page="works">Works</a>
      <a href="about.html" class="nav-link" data-page="about">About</a>
      <a href="contact.html" class="nav-link" data-page="contact">Contact</a>
      <div class="underline" id="underline"></div>
    </div>
    <button id="hamburger" class="md:hidden z-50">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <nav id="mobile-menu" class="hidden">
    <a href="index.html">Works</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="flex-1 pt-40">
    <div class="works-container">
      <div class="works-grid" id="projects"></div>
    </div>
  </main>

  <div id="title-cursor"><span id="title-cursor-text"></span></div>

  <footer class="py-20 px-6 text-center">
    <div class="flex justify-center gap-12">
      <a href="https://www.instagram.com/tristanpartridge/" target="_blank"><img src="insta logo.png" class="w-11 h-11 hover:scale-110 transition" alt="Instagram"></a>
      <a href="https://www.behance.net/tristanpartrid1" target="_blank"><img src="behance logo.png" class="w-11 h-11 hover:scale-110 transition" alt="Behance"></a>
    </div>
  </footer>

  <div id="bottom-copyright" class="fixed bottom-6 left-8 text-xs text-gray-500 select-none font-light tracking-wider z-50 pointer-events-none" style="opacity:0; visibility:hidden;">
    © <script>document.write(new Date().getFullYear())</script> Tristan Partridge
  </div>

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    const cursor = document.getElementById('title-cursor');
    const cursorText = document.getElementById('title-cursor-text');
    let isHovering = false;
    let cursorHidden = false;

    // Custom cursor
    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      window.addEventListener('scroll', () => {
        cursor.style.opacity = '0';
        document.body.style.cursor = 'default';
        isHovering = false;
        cursorHidden = true;
      });

      document.addEventListener('pointermove', e => {
        if (cursorHidden) cursorHidden = false;

        const thumb = e.target.closest('.project-thumb');
        if (thumb) {
          if (!isHovering) {
            cursorText.textContent = thumb.querySelector('img')?.alt || 'View';
            cursor.style.opacity = '1';
            document.body.style.cursor = 'none';
            isHovering = true;
          }
          cursor.style.left = e.clientX + 'px';
          cursor.style.top = e.clientY + 'px';
        } else if (isHovering) {
          cursor.style.opacity = '0';
          document.body.style.cursor = 'default';
          isHovering = false;
        }
      });
    }

    // === DIRECT NAVIGATION — NO TRANSITION ===
    const isReturning = sessionStorage.getItem('returnScroll') !== null;
    const hasSeenAnim = sessionStorage.getItem('hasSeenWorksAnimation') === 'true';

    function fadeInProjects() {
      gsap.fromTo(".project-card", 
        { opacity: 0, y: 70 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power2.out", stagger: 0.08 }
      );
      sessionStorage.setItem('hasSeenWorksAnimation', 'true');
    }

    fetch("works.json")
      .then(r => r.json())
      .then(projects => {
        const grid = document.getElementById("projects");
        const visible = projects.filter(p => !p.disabled && p.thumb && p.video);

        visible.forEach((project, i) => {
          const id = `project-${i}`;
          const card = document.createElement("div");
          card.className = "project-card";
          card.id = id;

          const thumb = document.createElement("div");
          thumb.className = "project-thumb";
          thumb.innerHTML = `<img src="images/${project.thumb}" alt="${project.title}" loading="lazy">`;

          // Direct navigation — no animation
          thumb.addEventListener('click', () => {
            sessionStorage.setItem('returnScroll', String(window.scrollY));
            sessionStorage.setItem('returnProjectId', id);
            window.location.href = project.video;
          });

          card.appendChild(thumb);
          grid.appendChild(card);
        });

        if (!isReturning && !hasSeenAnim) fadeInProjects();
        else gsap.set(".project-card", { opacity: 1, y: 0 });

        if (isReturning) {
          requestAnimationFrame(() => {
            const y = parseInt(sessionStorage.getItem('returnScroll'), 10) || 0;
            window.scrollTo(0, y);
            sessionStorage.removeItem('returnScroll');
            sessionStorage.removeItem('returnProjectId');
          });
        }
      });

    // Logo refresh
    document.getElementById('logo').addEventListener('click', e => {
      if (location.pathname === '/' || location.pathname.includes('index')) {
        e.preventDefault();
        sessionStorage.removeItem('hasSeenWorksAnimation');
        location.reload();
      }
    });

    // === ALL ORIGINAL SCRIPTS BELOW (unchanged) ===
    let lastY = 0;
    let hasScrolled = false;
    const nav = document.querySelector(".nav-container");
    window.addEventListener("scroll", () => {
      const y = window.scrollY;
      const d = y - lastY;
      if (y > 100) hasScrolled = true;
      if (hasScrolled) {
        if (d > 8) gsap.to(nav, { yPercent: -100, duration: 0.6, ease: "power4.out" });
        if (d < -8) gsap.to(nav, { yPercent: 0, duration: 0.6, ease: "power4.out" });
      }
      lastY = y;
    });
    window.addEventListener('load', () => gsap.set(nav, { yPercent: 0 }));

    const underline = document.getElementById('underline');
    const links = document.querySelectorAll('.nav-link');
    let currentTarget = document.querySelector('[data-page="works"]');

    function setUnderlineInstant(t) {
      if (!t || !underline) return;
      const r1 = t.getBoundingClientRect();
      const r2 = t.parentElement.getBoundingClientRect();
      underline.style.left = (r1.left - r2.left) + 'px';
      underline.style.width = r1.width + 'px';
    }

    window.addEventListener('load', () => setUnderlineInstant(currentTarget));
    links.forEach(l => {
      l.addEventListener('mouseenter', () => setUnderlineInstant(l));
      l.addEventListener('mouseleave', () => setUnderlineInstant(currentTarget));
      l.addEventListener('click', e => {
        e.preventDefault();
        links.forEach(x => x.classList.remove('active'));
        l.classList.add('active');
        currentTarget = l;
        setUnderlineInstant(l);
        window.location.href = l.getAttribute('href');
      });
    });
    window.addEventListener('resize', () => {
      clearTimeout(window._navTimer);
      window._navTimer = setTimeout(() => setUnderlineInstant(currentTarget), 80);
    });

    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');

    function lockBody(l) { document.body.style.overflow = l ? 'hidden' : ''; }

    hamburger.addEventListener('click', () => {
      const open = !mobileMenu.classList.contains('hidden');
      mobileMenu.classList.toggle('hidden', open);
      hamburger.setAttribute('aria-expanded', !open);
      lockBody(!open);
      const spans = hamburger.children;
      if (!open) {
        gsap.to(spans[0], { rotate: 45, y: 6, duration: 0.28 });
        gsap.to(spans[1], { opacity: 0, duration: 0.18 });
        gsap.to(spans[2], { rotate: -45, y: -6, duration: 0.28 });
      } else {
        gsap.to([spans[0], spans[2]], { rotate: 0, y: 0, duration: 0.28 });
        gsap.to(spans[1], { opacity: 1, duration: 0.18 });
      }
    });

    mobileMenu.addEventListener('click', e => {
      if (e.target.tagName === 'A' || e.target === mobileMenu) {
        mobileMenu.classList.add('hidden');
        hamburger.setAttribute('aria-expanded', 'false');
        lockBody(false);
        gsap.to(hamburger.children, { rotate: 0, y: 0, opacity: 1, duration: 0.2 });
      }
    });

    (function () {
      const el = document.getElementById('bottom-copyright');
      let shown = false;
      const check = () => {
        const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 100);
        if (nearBottom && !shown) {
          shown = true;
          el.style.visibility = 'visible';
          gsap.to(el, { opacity: 1, duration: 0.8 });
        } else if (!nearBottom && shown) {
          shown = false;
          gsap.to(el, { opacity: 0, duration: 0.3, onComplete: () => el.style.visibility = 'hidden' });
        }
      };
      window.addEventListener('scroll', check);
      window.addEventListener('load', check);
    })();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
